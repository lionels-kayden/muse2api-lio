# ==========================================
# Ví dụ cấu hình reverse proxy Nginx cho MUSE2API
# ==========================================
# Phù hợp với bảng điều khiển BT / 1Panel / Nginx độc lập
# Điểm cốt lõi: tăng proxy_read_timeout, tắt proxy_buffering để đảm bảo đầu ra streaming SSE
# ==========================================

server {
    listen 80;
    server_name your-domain.com; # Thay bằng tên miền hoặc IP của bạn

    # Cho phép tải lên ảnh tham chiếu (img2img / chỉnh sửa ảnh hỗ trợ ảnh lớn đa phương thức)
    client_max_body_size 64M;

    location / {
        proxy_pass http://127.0.0.1:18610;

        # Cốt lõi: tạo ảnh và tạo video cần 30~120 giây, mặc định 60s sẽ khiến Nginx báo 502 Bad Gateway
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_connect_timeout 60s;

        # Cốt lõi: tắt buffer, đảm bảo đầu ra kiểu máy đánh chữ streaming SSE của /v1/chat/completions với độ trễ 0
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        # Header proxy tiêu chuẩn
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Tương thích WebSocket
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
