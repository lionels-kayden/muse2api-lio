version: '3.8'

services:
  muse2api:
    build: .
    image: muse2api:latest
    container_name: muse2api
    restart: always
    ports:
      - "18610:18610"
    environment:
      # Khóa xác thực quản trị và API (đọc từ .env hoặc môi trường host, để trống thì tự động tạo)
      - MUSE2API_KEY=${MUSE2API_KEY:-}
      # URL cơ sở công khai của dịch vụ, ví dụ https://your-domain.com (để trống thì frontend quản trị tự động phát hiện tên miền hiện tại)
      - MUSE2API_PUBLIC_BASE=
      # Cấu hình thời gian chờ (giây)
      - MUSE2API_IMAGE_TIMEOUT=240
      - MUSE2API_VIDEO_TIMEOUT=600
      - MUSE2API_CHAT_TIMEOUT=300
    volumes:
      # Lưu trữ lâu dài cấu hình tài khoản, log tác vụ và tệp media
      - ./data:/app/data
    shm_size: '2gb' # Đảm bảo Chromium không bị sập do cạn kiệt /dev/shm khi kết xuất nhiều tab
